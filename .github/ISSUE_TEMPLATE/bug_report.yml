name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first. For security problems, don't file an issue — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Open a folder with …
        2. Draw a rectangle on …
        3. …
        Expected: …
        Actual: …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic info
      description: In SnipToss, choose Help → Copy Diagnostic Info and paste it here. It has versions and system info, no file paths.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a sample file, or the diagnostics package (Help → Export Diagnostics Package…) if you're comfortable sharing it. Check attachments for anything private first.
