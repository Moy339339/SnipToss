# Release pipeline (ADR-0002): push a v* tag -> run the full checks on Windows (same as ci.yml) -> scripts/publish.ps1 -> draft Release (with the installer, the portable zip and SHA256SUMS.txt).
# The Mac packages (the disk image and the zipped app) are built and checked by mac.yml in the same run, alongside the Windows job, and attached
# to the same Release: both apps share the version number, and each one's update check takes only the releases that carry its own package.
# Run by hand (workflow_dispatch) it only builds and checks the Mac packages, without a Release, to try the Mac half before tagging.
# A person reviews the draft before publishing it. Versions with a "-" (1.1.0-beta.1) are marked pre-release (the updater's beta channel). Signing is still to come.
# The tag must match the version in the root package.json: v1.0.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    uses: ./.github/workflows/mac.yml
    with:
      release: true
    secrets: inherit

  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The installer needs Inno Setup 6 (installer/SnipToss.iss); install a pinned 6.x when the runner image doesn't have one
      - name: Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version=6.7.1 -y --no-progress }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { throw 'Inno Setup 6 is not available' }

      - name: Tag matches the version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match the package.json version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - run: npm ci

      - run: npm run build

      - run: npm run verify
        shell: pwsh

      - name: Release packages (self-contained win-x64 + portable zip + SHA256)
        shell: pwsh
        run: |
          pwsh -File scripts/publish.ps1 -NoUi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/release/SnipToss-$env:VERSION-win-x64-setup.exe")) { throw 'The installer was not built' }

      # The installer: publish.ps1 builds it when Inno Setup 6 is installed on the runner
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            dist/release/SnipToss-${{ env.VERSION }}-*
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: tests/e2e/.results/
          retention-days: 7
          # .results starts with a dot: without this the upload skips it as hidden and finds nothing
          include-hidden-files: true

  # Both halves passed: one draft Release with the Windows and the Mac packages and the hashes of all of them
  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-packages
          path: release

      - uses: actions/download-artifact@v7
        with:
          pattern: SnipToss-mac-*
          path: release
          merge-multiple: true

      - name: Draft Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $mac = @(Get-ChildItem release -File -Filter "SnipToss-$version-mac-*")
          if (-not ($mac | Where-Object Extension -eq '.dmg')) { throw "No Mac disk image for $version" }
          $sums = $mac | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          [IO.File]::AppendAllText('release/SHA256SUMS.txt', ($sums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $files = @(Get-ChildItem release -File -Filter "SnipToss-$version-*" | ForEach-Object FullName) + 'release/SHA256SUMS.txt'
          $files | ForEach-Object { Split-Path $_ -Leaf }
          # The product line goes in the title: SnipToss Desktop is the Windows and the Mac app, which share the version number (SnipToss for Chrome has its own)
          $flags = @('--draft', '--generate-notes', '--title', "SnipToss Desktop $version")
          if ($version -match '-') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @files @flags
