# On every push and every PR: type check + lint + unit tests (TS, C#) + design-rules check + UI e2e (mock host, using the runner's own Edge),
# the same set as npm run verify locally. On CI, C# analyzer warnings are errors (Directory.Build.props checks CI=true).
# The real-shell smoke tests (they need WebView2 and a desktop session) are not run here yet
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      # Build core / cli first (web and the tests use their dist output)
      - run: npm run build

      - run: npm run verify
        shell: pwsh

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: tests/e2e/.results/
          retention-days: 7
          # .results starts with a dot: without this the upload skips it as hidden and finds nothing
          include-hidden-files: true
