name: mac

# macOS builds and checks for the Mac shell (app-mac/). Runs on every push to the mac branch only.
# No workflow_dispatch: GitHub only offers it for workflow files on the default branch, and this file is kept off main.
on:
  push:
    branches: [mac]

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-mac:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # The shell's message catalogs and formatter (built in "Build the shell's resources"), for the unit tests and the smoke runs
      SNIPTOSS_RESOURCES_DIR: ${{ github.workspace }}/app-mac/.build/resources
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The web UI the shell hosts (packages/web/dist)
      - run: npm run build

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build the shell
        working-directory: app-mac
        run: swift build -c release

      # The files the shell reads at run time: the message formatter (the UI's intl-messageformat, for JavaScriptCore) and the catalogs
      - name: Build the shell's resources
        run: node app-mac/scripts/build-resources.mjs

      - name: Unit tests
        working-directory: app-mac
        run: swift test

      # Opens the window with an empty library, waits for the welcome screen, writes ui.png and result.json, and quits
      - name: Smoke run (empty library)
        if: ${{ !cancelled() }}
        run: |
          export SNIPTOSS_VERSION="$(node -p "require('./package.json').version")"
          export SNIPTOSS_UI_DIR="$GITHUB_WORKSPACE/packages/web/dist"
          export SNIPTOSS_SETTINGS="$RUNNER_TEMP/data-empty/settings.json"
          export SNIPTOSS_SMOKE_OUT="$RUNNER_TEMP/smoke/empty"
          # The performance budget lines (Perf.swift), printed for a look: a CI machine is no measure of a real one
          export SNIPTOSS_PERF_LOG="$RUNNER_TEMP/smoke/perf.log"
          app-mac/.build/release/SnipToss
          cat "$SNIPTOSS_PERF_LOG" || true

      # The menu bar the page asked for (setMenus): the app menu and the page's seven menus, and the four standard items at the end of Edit
      - name: Check the menu bar
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/smoke/empty/result.json");
            const bar = r.menuBar || {};
            const problems = [];
            if (!r.bridgeCalls.includes("setMenus")) problems.push("the page never sent setMenus");
            if (r.bridgeUnhandled.includes("setMenus")) problems.push("setMenus is not implemented");
            if ((bar.titles || []).length !== 8) problems.push("expected 8 menus, got " + JSON.stringify(bar.titles));
            if ((bar.standardEditItems || []).length !== 4) problems.push("standard Edit items: " + JSON.stringify(bar.standardEditItems));
            if (problems.length) { console.error(problems.join(String.fromCharCode(10))); process.exit(1); }
            console.log("menu bar ok", JSON.stringify(bar));
          '

      # The same with a project in the library and one item selected: the scan, the media scheme, and the image decoded on the canvas
      - name: Smoke run (project with an image)
        if: ${{ !cancelled() }}
        run: |
          export SNIPTOSS_VERSION="$(node -p "require('./package.json').version")"
          export SNIPTOSS_UI_DIR="$GITHUB_WORKSPACE/packages/web/dist"
          export SNIPTOSS_SETTINGS="$RUNNER_TEMP/data-project/settings.json"
          export SNIPTOSS_SMOKE_OUT="$RUNNER_TEMP/smoke/project"
          export SNIPTOSS_SMOKE_READY=image
          mkdir -p "$RUNNER_TEMP/data-project"
          PROJECT="$GITHUB_WORKSPACE/tests/e2e/fixtures/project" node -e '
            const project = process.env.PROJECT;
            const settings = {
              Library: [{ Path: project, Pinned: false }],
              Selected: project + "/assets/hero.png",
              // The tour and first-use hints count as seen, so the picture shows the screen itself
              Prefs: { language: "en", onboarding: ["tour", "hint.copy", "hint.video"] },
            };
            require("fs").writeFileSync(process.env.SNIPTOSS_SETTINGS, JSON.stringify(settings, null, 2) + "\n");
          '
          app-mac/.build/release/SnipToss

      # First run: nothing is marked as seen, so the onboarding tour starts by itself. Two pictures and the card's own text and styles are
      # recorded to tell a card that is empty because the text is not drawn from one caught while it fades in
      - name: Smoke run (first run, tour)
        if: ${{ !cancelled() }}
        run: |
          export SNIPTOSS_VERSION="$(node -p "require('./package.json').version")"
          export SNIPTOSS_UI_DIR="$GITHUB_WORKSPACE/packages/web/dist"
          export SNIPTOSS_SETTINGS="$RUNNER_TEMP/data-tour/settings.json"
          export SNIPTOSS_SMOKE_OUT="$RUNNER_TEMP/smoke/tour"
          export SNIPTOSS_SMOKE_READY=tour
          mkdir -p "$RUNNER_TEMP/data-tour"
          PROJECT="$GITHUB_WORKSPACE/tests/e2e/fixtures/project" node -e '
            const project = process.env.PROJECT;
            const settings = { Library: [{ Path: project, Pinned: false }], Selected: project + "/assets/hero.png" };
            require("fs").writeFileSync(process.env.SNIPTOSS_SETTINGS, JSON.stringify(settings, null, 2) + "\n");
          '
          app-mac/.build/release/SnipToss
      # Keys with the command key in a text box and in front of a menu item (KeyExperiment.swift): first without a main menu, as the
      # app was before it had one, then with the standard menus. The answers are in result.json under keyExperiment
      - name: Smoke run (keys, no main menu)
        if: ${{ !cancelled() }}
        run: |
          export SNIPTOSS_VERSION="$(node -p "require('./package.json').version")"
          export SNIPTOSS_UI_DIR="$GITHUB_WORKSPACE/packages/web/dist"
          export SNIPTOSS_SETTINGS="$RUNNER_TEMP/data-keys-nomenu/settings.json"
          export SNIPTOSS_SMOKE_OUT="$RUNNER_TEMP/smoke/keys-nomenu"
          export SNIPTOSS_SMOKE_READY=keys
          export SNIPTOSS_SMOKE_NOMENU=1
          app-mac/.build/release/SnipToss

      - name: Smoke run (keys, standard menus)
        if: ${{ !cancelled() }}
        run: |
          export SNIPTOSS_VERSION="$(node -p "require('./package.json').version")"
          export SNIPTOSS_UI_DIR="$GITHUB_WORKSPACE/packages/web/dist"
          export SNIPTOSS_SETTINGS="$RUNNER_TEMP/data-keys/settings.json"
          export SNIPTOSS_SMOKE_OUT="$RUNNER_TEMP/smoke/keys"
          export SNIPTOSS_SMOKE_READY=keys
          app-mac/.build/release/SnipToss

      # The capture layers over a made-up pattern (the runner's real screen is never captured): one layer a screen, the kind of window it
      # is, the picture drawn at the screen's resolution and dimmed by half, Esc sent through the event queue ends the capture, a right
      # click ends a second one, and a fourth goes through the main line with posted mouse and key events. In Chinese, so the pictures of
      # the layer show the words most users see
      - name: Smoke run (capture layers)
        if: ${{ !cancelled() }}
        run: |
          export SNIPTOSS_VERSION="$(node -p "require('./package.json').version")"
          export SNIPTOSS_UI_DIR="$GITHUB_WORKSPACE/packages/web/dist"
          export SNIPTOSS_SETTINGS="$RUNNER_TEMP/data-capture/settings.json"
          export SNIPTOSS_SMOKE_OUT="$RUNNER_TEMP/smoke/capture"
          export SNIPTOSS_SMOKE_READY=capture
          mkdir -p "$RUNNER_TEMP/data-capture"
          echo '{ "Prefs": { "language": "zh-CN" } }' > "$SNIPTOSS_SETTINGS"
          app-mac/.build/release/SnipToss

      # Level 1000 is NSWindow.Level.screenSaver; 262481 is canJoinAllSpaces | stationary | ignoresCycle | fullScreenAuxiliary |
      # canJoinAllApplications
      - name: Check the capture layers
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/smoke/capture/result.json");
            const c = r.capture || {};
            const layers = c.layers || [];
            const problems = [];
            const hk = r.hotkey || {};
            if (hk.registered !== hk.asked || hk.error !== "none") problems.push("capture shortcut: " + JSON.stringify(hk));
            if (!c.opened) problems.push("the capture did not open");
            if (layers.length < 1 || layers.length !== c.screens) problems.push(layers.length + " layers for " + c.screens + " screens");
            layers.forEach((l, i) => {
              const say = (what) => problems.push("layer " + i + ": " + what);
              if (l.level !== 1000) say("level " + l.level);
              if (l.behavior !== 262481) say("collection behavior " + l.behavior);
              if (!l.nonactivating || !l.borderless) say("style: nonactivating " + l.nonactivating + ", borderless " + l.borderless);
              if (!l.canBecomeKey || !l.visible) say("canBecomeKey " + l.canBecomeKey + ", visible " + l.visible);
              if (JSON.stringify(l.frame) !== JSON.stringify(l.screenFrame)) say("frame " + JSON.stringify(l.frame) + " on screen " + JSON.stringify(l.screenFrame));
              const want = [Math.round(l.frame[2] * l.scale), Math.round(l.frame[3] * l.scale)];
              if (JSON.stringify(l.pixels) !== JSON.stringify(want)) say("pixels " + JSON.stringify(l.pixels) + ", expected " + JSON.stringify(want));
              // A sample on the outline of the highlight or under the size label is left out
              const samples = l.samples || [];
              if (samples.length < 1) say("no samples");
              // The expected colors are worked out in the color space of the layer (CaptureSmoke.shown), as the drawing is
              for (const s of samples) {
                const off = s.expected.length !== 3 || s.actual.some((v, k) => !(Math.abs(v - s.expected[k]) <= 8));
                if (off) say("pixel " + s.at + " is " + s.actual + ", expected " + s.expected + " (" + l.colorSpace + ")");
              }
            });
            if (!c.closedByEsc) problems.push("Esc did not end the capture (key layer " + c.keyLayer + ", key window is a layer " + c.keyWindowIsLayer + ", app active " + c.appActive + ")");
            if (!c.closed || c.layersAfter !== 0) problems.push("still open after the end: " + c.layersAfter + " layers");
            if (c.whenClosedCalls !== 1) problems.push("the end was announced " + c.whenClosedCalls + " times");
            const rc = c.rightClick || {};
            if (!rc.closedByRightClick || rc.whenClosedCalls !== 1) problems.push("a right click did not end the second capture: " + JSON.stringify(rc));
            // Started while another program was in front: the layer still gets the keyboard and Esc ends it
            const front = c.otherAppInFront || {};
            if (!front.otherAppWasInFront) console.log("warning: Finder could not be brought to the front, so the third round tested nothing");
            else if (!["panel", "activated"].includes(front.keyboardRoute) || !front.closedByEsc) problems.push("with another program in front: " + JSON.stringify(front));
            console.log("with another program in front: " + JSON.stringify(front));
            if (problems.length) { console.error(problems.join(String.fromCharCode(10))); process.exit(1); }
            console.log("capture layers ok", JSON.stringify(c));
          '

      # The main line of a capture, step by step (CaptureSmoke.mainLineRound): what the layer was after each posted click, drag and key
      - name: Check the capture main line
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/smoke/capture/result.json");
            const m = (r.capture || {}).mainLine || {};
            const problems = [];
            const step = {};
            for (const s of m.steps || []) step[s.step] = s;
            const expect = (name, what, ok) => { if (!step[name] || !ok(step[name])) problems.push(name + ": " + what + " " + JSON.stringify(step[name] || "missing")); };
            const mark = (s, i) => (s.marks || [])[i] || {};
            if (!m.opened) problems.push("the main line did not open: " + JSON.stringify(m));
            expect("select", "a selection, the toolbar and its buttons", (s) => s.sel && s.toolbar && s.op === "noDrag" && (s.buttons || []).includes("done"));
            expect("rectTool", "Rectangle chosen by a click on the toolbar", (s) => s.tool === "rect" && (s.buttons || []).includes("color-ff6a3d"));
            expect("drawRect", "the note box open with the keyboard, the layer below the input method", (s) => s.noteOpen && s.note && s.note.title && s.firstResponder === "note" && s.level === 26 && mark(s, 0).kind === "rect");
            expect("typeNote", "the typed note, the key x included", (s) => s.note && s.note.text === "Make this bluex" && s.note.saveEnabled);
            expect("saveNote", "Save clicked: note 1 written, the keyboard back on the layer", (s) => !s.noteOpen && mark(s, 0).note === "Make this bluex" && mark(s, 0).number === 1 && s.firstResponder === "overlay" && s.level === 1000);
            expect("pinTool", "the Pin chosen with C", (s) => s.tool === "note");
            expect("placePin", "a Pin placed and its note box open", (s) => s.noteOpen && mark(s, 1).kind === "note" && mark(s, 1).pending === 2);
            expect("typePin", "note 2 saved with Return", (s) => !s.noteOpen && mark(s, 1).note === "Remove this" && mark(s, 1).number === 2);
            expect("textTool", "Text chosen with T", (s) => s.tool === "text");
            expect("placeText", "the text box open with the keyboard", (s) => s.textOpen && s.firstResponder === "text");
            expect("typeText", "the text ended with Esc", (s) => !s.textOpen && mark(s, 2).kind === "text" && mark(s, 2).text === "Hi");
            expect("escapeWarns", "Esc after notes only warns", (s) => s.open && s.warn);
            expect("finish", "Finish on the toolbar ends the capture", (s) => s.open === false);
            if (!m.closed || m.whenClosedCalls !== 1) problems.push("the end: closed " + m.closed + ", announced " + m.whenClosedCalls + " times");
            const res = m.result || {};
            const notes = (res.marks || []).filter((k) => k.number > 0).length;
            if ((res.marks || []).length !== 3 || notes !== 2) problems.push("collected: " + JSON.stringify(res));
            if (!m.picture) problems.push("no picture of the layer");
            // What finishing handed over: the composited picture as wide as the selection (or the notes area), saved, on the clipboard as
            // PNG and TIFF without words (the notes are in the picture), and the copied notice
            const out = m.output || {};
            const sel = (step.select || {}).sel || [0, 0, 0, 0];
            if (!out.size || out.size[0] < Math.round(sel[2]) || out.size[1] <= Math.round(sel[3])) problems.push("composited picture " + JSON.stringify(out.size) + " for the selection " + JSON.stringify(sel));
            if (!out.fileSaved) problems.push("the picture was not saved: " + JSON.stringify(out.file));
            if (out.clipboardPuts !== 1 || !out.clipboardPngBytes || !out.clipboardHasTiff || out.clipboardText !== null) problems.push("clipboard: " + JSON.stringify(out));
            if ((out.notices || []).length !== 1 || out.notices[0].kind !== "toast") problems.push("notices: " + JSON.stringify(out.notices));
            if (problems.length) { console.error(problems.join(String.fromCharCode(10))); process.exit(1); }
            console.log("capture main line ok", JSON.stringify(res), JSON.stringify(out));
          '

      # The annotate run (CaptureSmoke.annotate), the one meant for trying a build on a Mac nobody may touch: one capture through the whole
      # of annotating, with the pattern only, the clipboard recorded and the picture saved next to the settings file
      - name: Smoke run (annotate)
        if: ${{ !cancelled() }}
        run: |
          export SNIPTOSS_VERSION="$(node -p "require('./package.json').version")"
          export SNIPTOSS_UI_DIR="$GITHUB_WORKSPACE/packages/web/dist"
          export SNIPTOSS_SETTINGS="$RUNNER_TEMP/data-annotate/settings.json"
          export SNIPTOSS_SMOKE_OUT="$RUNNER_TEMP/smoke/annotate"
          export SNIPTOSS_SMOKE_READY=annotate
          export SNIPTOSS_PERF_LOG="$RUNNER_TEMP/smoke/perf.log"
          app-mac/.build/release/SnipToss
          cat "$SNIPTOSS_PERF_LOG" || true

      - name: Check the annotate run
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/smoke/annotate/result.json");
            const a = (r.annotate || {}).annotate || {};
            const problems = [];
            const step = {};
            for (const s of a.steps || []) step[s.step] = s;
            const expect = (name, what, ok) => { if (!step[name] || !ok(step[name])) problems.push(name + ": " + what + " " + JSON.stringify(step[name] || "missing")); };
            const mark = (s, i) => (s.marks || [])[i] || {};
            const box = (s) => s.sel || [0, 0, 0, 0];
            if (!a.opened) problems.push("the capture did not open: " + JSON.stringify(a));
            expect("select", "a selection", (s) => s.sel && s.toolbar && s.handles);
            expect("move", "the selection moved, same size", (s) => box(s)[0] > box(step.select)[0] && box(s)[1] > box(step.select)[1] && box(s)[2] === box(step.select)[2] && box(s)[3] === box(step.select)[3]);
            expect("resize", "the selection grew by its corner", (s) => box(s)[0] === box(step.move)[0] && box(s)[2] > box(step.move)[2] && box(s)[3] > box(step.move)[3]);
            expect("rectTool", "Rectangle chosen on the toolbar", (s) => s.tool === "rect");
            expect("drawRect", "a rectangle and its note box", (s) => s.noteOpen && mark(s, 0).kind === "rect");
            expect("typeNote", "the typed note", (s) => s.note && s.note.text === "Make the title largerx");
            expect("saveWithReturn", "note 1 saved with Return", (s) => !s.noteOpen && mark(s, 0).note === "Make the title largerx" && mark(s, 0).number === 1);
            expect("arrowTool", "Arrow chosen with A", (s) => s.tool === "arrow");
            expect("drawArrow", "an arrow and its note box", (s) => s.noteOpen && mark(s, 1).kind === "arrow");
            expect("saveWithButton", "note 2 saved with the button", (s) => !s.noteOpen && mark(s, 1).note === "Point this at the menu" && mark(s, 1).number === 2);
            expect("finish", "Finish ends the capture", (s) => s.open === false);
            const out = a.output || {};
            if (!out.fileSaved || out.clipboardPuts !== 1 || !out.clipboardPngBytes || (out.notices || []).length !== 1) problems.push("output: " + JSON.stringify(out));
            if (((a.result || {}).marks || []).length !== 2) problems.push("collected: " + JSON.stringify(a.result));
            if (problems.length) { console.error(problems.join(String.fromCharCode(10))); process.exit(1); }
            console.log("annotate run ok", JSON.stringify(a.result), JSON.stringify(out), "keyboard " + a.keyboardRoute);
          '

      # The project's self-signed code signing certificate (CN=MoyGoldenAge), from the repository's secrets into a keychain of this run
      # only. With it every build has the same signing identity, and macOS keeps the Screen Recording permission across builds. Without
      # the secrets (a fork) the package is signed ad hoc
      - name: Signing identity
        if: ${{ !cancelled() }}
        env:
          P12: ${{ secrets.MAC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then echo "no signing certificate: the package is signed ad hoc"; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          # The identity (certificate with its private key) as the keychain sees it; self-signed, so it is listed as not trusted, which
          # does not stop codesign
          fingerprint="$(security find-identity -p codesigning "$keychain" | awk '/^ *1\)/ { print $2; exit }')"
          if [ -z "$fingerprint" ]; then echo "no signing identity in the keychain after the import"; exit 1; fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "signing with the certificate $fingerprint"
          echo "SNIPTOSS_SIGN_IDENTITY=$fingerprint" >> "$GITHUB_ENV"
          echo "SNIPTOSS_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # A package for trying the app on a Mac, not a release: SnipToss.app with the UI and the catalogs inside, zipped
      - name: Package the app (trial)
        if: ${{ !cancelled() }}
        run: node app-mac/scripts/package-app.mjs "$RUNNER_TEMP/package" "${{ github.run_number }}"

      # The packaged app on its own, as a user opens it: no UI folder or resources from the environment, so it must find both in the
      # bundle; the language is set to Chinese, so the app menu shows a catalog message only when the bundle's catalogs were read
      - name: Smoke run (packaged app)
        if: ${{ !cancelled() }}
        run: |
          unset SNIPTOSS_RESOURCES_DIR
          export SNIPTOSS_SETTINGS="$RUNNER_TEMP/data-package/settings.json"
          export SNIPTOSS_SMOKE_OUT="$RUNNER_TEMP/smoke/package"
          mkdir -p "$RUNNER_TEMP/data-package"
          echo '{ "Prefs": { "language": "zh-CN" } }' > "$SNIPTOSS_SETTINGS"
          "$RUNNER_TEMP/package/SnipToss.app/Contents/MacOS/SnipToss"

      - name: Check the packaged app
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/smoke/package/result.json");
            const b = r.bundle || {};
            const version = require("./package.json").version;
            const problems = [];
            if (!r.ready) problems.push("the UI did not come up from the bundle");
            if (b.id !== "io.github.moy339339.sniptoss") problems.push("bundle id " + b.id);
            if (b.version !== version) problems.push("bundle version " + b.version + ", package.json " + version);
            if (b.about !== "关于超级批注") problems.push("the catalogs in the bundle were not read: " + b.about);
            // The name Finder, the Dock and System Settings show on a Chinese system
            const strings = (language) => { try { return require("fs").readFileSync(process.env.RUNNER_TEMP + "/package/SnipToss.app/Contents/Resources/" + language + ".lproj/InfoPlist.strings", "utf8"); } catch { return ""; } };
            if (!strings("zh-Hans").includes("超级批注") || !strings("zh-Hant").includes("超級批註")) problems.push("localized app names: " + JSON.stringify([strings("zh-Hans"), strings("zh-Hant")]));
            if ((r.menuBar?.titles || []).length !== 8) problems.push("menus: " + JSON.stringify(r.menuBar?.titles));
            if (r.pageErrors.length) problems.push("page errors: " + JSON.stringify(r.pageErrors));
            if (problems.length) { console.error(problems.join(String.fromCharCode(10))); process.exit(1); }
            console.log("packaged app ok", JSON.stringify(b));
          '

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: SnipToss-mac-trial
          path: ${{ runner.temp }}/package/SnipToss-mac-*.zip
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-mac-smoke
          path: |
            ${{ runner.temp }}/smoke
            ${{ runner.temp }}/data-*/logs
          if-no-files-found: warn
