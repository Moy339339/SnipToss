name: mac

# macOS builds and checks for the Mac shell (app-mac/). Runs on every push to the mac branch only.
# No workflow_dispatch: GitHub only offers it for workflow files on the default branch, and this file is kept off main.
on:
  push:
    branches: [mac]

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-mac:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The web UI the shell hosts (packages/web/dist)
      - run: npm run build

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build the shell
        working-directory: app-mac
        run: swift build -c release

      - name: Unit tests
        working-directory: app-mac
        run: swift test

      # Opens the window, waits for the first screen, writes ui.png and result.json, and quits
      - name: Smoke run
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          export SNIPTOSS_VERSION="$(node -p "require('./package.json').version")"
          export SNIPTOSS_UI_DIR="$GITHUB_WORKSPACE/packages/web/dist"
          export SNIPTOSS_SMOKE_OUT="$RUNNER_TEMP/smoke"
          app-mac/.build/release/SnipToss

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-mac-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
